<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOW Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
	
	<link rel="stylesheet" href="style.css">
	
	<script src="mounts.js"></script>
	<script src="monsters.js"></script>
	<script src="weapons.js"></script>

</head>
<body class="min-h-screen pb-20">

    <div id="loadingOverlay">
        <div class="w-12 h-12 border-4 border-slate-200 border-t-[#b59b6d] rounded-full animate-spin mb-4"></div>
        <p class="serif-header text-lg font-bold text-slate-800">Consulting the Archives...</p>
    </div>

    <nav class="bg-slate-900 text-white shadow-lg sticky top-0 z-40 border-b-2 border-[#b59b6d]">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-book-atlas text-[#b59b6d] text-2xl"></i>
                <h1 class="serif-header text-2xl font-black tracking-tight uppercase">TOW Dashboard </h1>
            </div>
            <button onclick="document.getElementById('fileInput').click()" class="bg-white/10 hover:bg-white/20 border border-white/20 px-5 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2">
                <i class="fa-solid fa-file-arrow-up"></i> IMPORT OWB JSON
            </button>
            <input type="file" id="fileInput" class="hidden" accept=".json">
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6 md:p-10 grid grid-cols-1 lg:grid-cols-4 gap-10">
        <aside class="space-y-6">
            <div id="armyMeta" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 sticky top-24 transition-all duration-300">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Tactical Summary</h3>
                <p class="text-sm text-slate-500 italic">No scrolls detected.</p>
            </div>
        </aside>

        <main class="lg:col-span-3">
            <div id="unitContainer" class="flex flex-col gap-4"></div>
        </main>
    </div>

    <div id="drawerOverlay" class="drawer-overlay" onclick="closeDrawer()"></div>
    <div id="ruleDrawer" class="fixed top-0 right-0 h-full w-full md:w-[550px] z-[60] shadow-2xl flex flex-col">
        <div class="p-4 border-b flex justify-between items-center bg-slate-50">
            <h2 id="drawerTitle" class="serif-header text-xl font-black uppercase tracking-tight text-slate-800">Reference</h2>
            <button onclick="closeDrawer()" class="p-2 hover:bg-slate-200 rounded-full transition text-slate-400 text-2xl leading-none">&times;</button>
        </div>
        <div class="flex-grow relative">
            <div id="drawerLoader" class="absolute inset-0 flex items-center justify-center bg-white z-10"><div class="w-8 h-8 border-4 border-slate-200 border-t-[#b59b6d] rounded-full animate-spin"></div></div>
            <iframe id="ruleFrame" src="" class="w-full h-full border-none"></iframe>
        </div>
    </div>
<script src="script.js"></script>

</body>
</html>
